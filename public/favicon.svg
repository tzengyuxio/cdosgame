<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="中文 DOS 遊戲資料庫 — C:\&gt; 提示符">
  <defs>
    <radialGradient id="crt" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#141210"/>
      <stop offset="70%" stop-color="#0c0c0c"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <rect y="2" width="4" height="1.1" fill="#000" opacity="0.30"/>
    </pattern>
  </defs>
  <!-- CRT screen -->
  <rect width="64" height="64" rx="9" fill="url(#crt)"/>
